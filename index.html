<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KvízAréna</title>
    <script src="questions.js"></script>
</head>

<body>

    <!-- ========================= -->
    <!-- 1. NÉV MEGADÁSA           -->
    <!-- ========================= -->

    <div id="nameScreen">

        <h1>🧠 KvízAréna</h1>

        <p>Üdvözöllek a KvízArénában!</p>

        <h2>Írd be a neved a játék kezdéséhez!</h2>

        <input
            type="text"
            id="playerName"
            placeholder="Neved..."
            maxlength="30"
        >

        <button onclick="startGame()">
            Tovább
        </button>

        <p id="errorMessage"></p>

    </div>


    <!-- ========================= -->
    <!-- 2. NEHÉZSÉG               -->
    <!-- ========================= -->

    <div id="difficultyScreen" style="display: none;">

        <h1>🎮 Válassz nehézséget!</h1>

        <p id="welcomeMessage"></p>

        <button onclick="chooseDifficulty('Könnyű', 30)">
            🟢 Könnyű
            <br>
            30 kérdés
        </button>

        <br><br>

        <button onclick="chooseDifficulty('Nehéz', 60)">
            🟡 Nehéz
            <br>
            60 kérdés
        </button>

        <br><br>

        <button onclick="chooseDifficulty('Nagyon nehéz', 90)">
            🔴 Nagyon nehéz
            <br>
            90 kérdés
        </button>

        <br><br>

        <button onclick="chooseDifficulty('Lehetetlen', 120)">
            ☠️ Lehetetlen
            <br>
            120 kérdés
        </button>

    </div>


    <!-- ========================= -->
    <!-- 3. KATEGÓRIA              -->
    <!-- ========================= -->

    <div id="categoryScreen" style="display: none;">

        <h1>📚 Válassz kategóriát!</h1>

        <p id="categoryInfo"></p>


        <button onclick="chooseCategory('Magyarország')">
            🇭🇺 Magyarország
        </button>

        <br><br>

        <button onclick="chooseCategory('Történelem')">
            📜 Történelem
        </button>

        <br><br>

        <button onclick="chooseCategory('Földrajz')">
            🌍 Földrajz
        </button>

        <br><br>

        <button onclick="chooseCategory('Tudomány')">
            🔬 Tudomány
        </button>

        <br><br>

        <button onclick="chooseCategory('Sport')">
            ⚽ Sport
        </button>

        <br><br>

        <button onclick="chooseCategory('Film és sorozat')">
            🎬 Film és sorozat
        </button>

        <br><br>

        <button onclick="chooseCategory('Zene')">
            🎵 Zene
        </button>

        <br><br>

        <button onclick="chooseCategory('Videójátékok')">
            🎮 Videójátékok
        </button>

        <br><br>

        <button onclick="chooseCategory('Irodalom')">
            📚 Irodalom
        </button>

        <br><br>

        <button onclick="chooseCategory('Technológia')">
            💻 Technológia
        </button>

    </div>
    <!-- ========================= -->
    <!-- 4. KVÍZ KÉPERNYŐ           -->
    <!-- ========================= -->

    <div id="quizScreen" style="display: none;">

        <h1>🧠 KvízAréna</h1>

        <p id="quizInfo"></p>

        <h2 id="questionNumber"></h2>

        <h2 id="questionText"></h2>


        <div id="answers">

            <button id="answer0" onclick="answerQuestion(0)"></button>

            <br><br>

            <button id="answer1" onclick="answerQuestion(1)"></button>

            <br><br>

            <button id="answer2" onclick="answerQuestion(2)"></button>

            <br><br>

            <button id="answer3" onclick="answerQuestion(3)"></button>

        </div>


        <p id="feedback"></p>


        <button
            id="nextButton"
            onclick="nextQuestion()"
            style="display: none;"
        >
            Következő kérdés ➡️
        </button>

    </div>

    <!-- ========================= -->
    <!-- JAVASCRIPT                -->
    <!-- ========================= -->

    <script>

        let playerName = "";

        let selectedDifficulty = "";

        let selectedQuestionCount = "";

        let selectedCategory = "";


        // =========================
        // NÉV ELMENTÉSE
        // =========================

        function startGame() {

            const name =
                document.getElementById("playerName")
                .value
                .trim();

            const errorMessage =
                document.getElementById("errorMessage");


            if (name === "") {

                errorMessage.textContent =
                    "❌ A név megadása kötelező!";

                return;
            }


            playerName = name;


            document.getElementById("nameScreen")
                .style.display = "none";


            document.getElementById("difficultyScreen")
                .style.display = "block";


            document.getElementById("welcomeMessage")
                .textContent =
                "Szia, " +
                playerName +
                "! Válaszd ki a nehézséget.";
        }


        // =========================
        // NEHÉZSÉG KIVÁLASZTÁSA
        // =========================

        function chooseDifficulty(
            difficulty,
            questionCount
        ) {

            selectedDifficulty = difficulty;

            selectedQuestionCount = questionCount;


            document.getElementById("difficultyScreen")
                .style.display = "none";


            document.getElementById("categoryScreen")
                .style.display = "block";


            document.getElementById("categoryInfo")
                .textContent =
                difficulty +
                " mód • " +
                questionCount +
                " kérdés";
        }


        // =========================
        // KATEGÓRIA KIVÁLASZTÁSA
        // =========================

        function chooseCategory(category) {

            selectedCategory = category;


            function chooseCategory(category) {

    selectedCategory = category;

    quizQuestions = questions.filter(function(question) {

        return (
            question.category === selectedCategory &&
            question.difficulty === selectedDifficulty
        );

    });


    if (quizQuestions.length === 0) {

        alert(
            "Ehhez a kategóriához és nehézséghez még nincs elég kérdés."
        );

        return;
    }


    quizQuestions = quizQuestions.sort(function() {

        return Math.random() - 0.5;

    });


    quizQuestions =
        quizQuestions.slice(0, selectedQuestionCount);


    currentQuestionIndex = 0;

    score = 0;


    document.getElementById("categoryScreen")
        .style.display = "none";


    document.getElementById("quizScreen")
        .style.display = "block";


    showQuestion();
}

let currentQuestionIndex = 0;

let score = 0;
        }

    </script>

</body>

</html>
