<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KvízAréna</title>
</head>

<body>

    <h1>🧠 KvízAréna</h1>

    <p>Üdvözöllek a KvízArénában!</p>

    <h2>Írd be a neved a játék kezdéséhez!</h2>

    <input
        type="text"
        id="playerName"
        placeholder="Neved..."
        maxlength="30"
    >

    <button onclick="startGame()">Tovább</button>

    <p id="errorMessage"></p>


    <script>

        function startGame() {

            const name = document
                .getElementById("playerName")
                .value
                .trim();

            const errorMessage =
                document.getElementById("errorMessage");


            if (name === "") {

                errorMessage.textContent =
                    "❌ A név megadása kötelező!";

                return;
            }


            alert("Szia, " + name + "!");
        }

    </script>

</body>

</html>
